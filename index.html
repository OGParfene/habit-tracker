<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f6f2" />
    <meta
      name="description"
      content="Tus hábitos, a tu ritmo. Registra tu día y descubre tu progreso."
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>A tu ritmo · Hábitos</title>
    <script type="module" crossorigin src="./assets/app-DhvAXFc1.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/app-D96xEoa-.css">
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <a class="brand" href="#today"
          ><span class="brand-icon"
            ><img src="./icon.svg" alt="" width="44" height="44" /></span
          ><span>A tu ritmo<small>UN POCO, CADA DÍA</small></span></a
        >
        <nav aria-label="Navegación principal">
          <button data-view="today">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="8" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <span>Hoy</span></button
          ><button data-view="history">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="4" y="5" width="16" height="16" rx="3" />
              <path d="M8 3v4m8-4v4M4 11h16m-11 4h1m4 0h1" />
            </svg>
            <span>Historial</span></button
          ><button data-view="progress">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M5 20V10m7 10V4m7 16v-7" />
            </svg>
            <span>Progreso</span></button
          ><button data-view="settings">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="3" />
              <path
                d="m9 3 6 0 1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1Z"
              />
            </svg>
            <span>Ajustes</span>
          </button>
        </nav>
        <div class="sidebar-bottom">
          <div class="brand-signature" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
          <p>La constancia también<br />incluye volver.</p>
          <span id="sync-status" role="status"
            >Guardado en este dispositivo</span
          >
        </div>
      </aside>
      <main id="main" tabindex="-1"></main>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="detail">
      <div id="detail-content"></div>
      <button class="secondary" id="close-dialog">Cerrar</button>
    </dialog>
  </body>
</html>
